        - paragraph [ref=f9e1802]
        - heading "无 EL 路线" [level=3] [ref=f9e1804]
        - paragraph [ref=f9e1805]: 直接写合法 jar 进 WEB-INF/lib 再触发 reload，只不过构造比较麻烦。
        - paragraph [ref=f9e1806]:
          - text: content 以 UTF-8 落盘，每个字节必须小于 0x80（不然多字节，zip 长度偏移字段全错位）、不在
          - code [ref=f9e1807]: "&<'>\"()"
          - text: 七个转义里、首尾不能是小于等于 0x20（参数会 trim）。
        - paragraph [ref=f9e1808]:
          - text: zip 从尾部 EOCD 解析、头部允许垃圾，脏数据前缀留文件头，CD 和 EOCD 的偏移字段都加 27；后缀
          - code [ref=f9e1809]: DIRTY DATA AT THE END
          - text: 当 EOCD 注释——注释长度字段设 21，服务端拼的后缀正好是注释正文，
          - code [ref=f9e1810]: len - i - ENDHDR - commentLen == 0
          - text: 完美通过。但 content 末尾是注释长度的高字节 0x00 会被 trim 掉，EOCD 后要垫几个大于 0x20 的字符（C0NY1），注释长度写成占位加 21。
        - paragraph [ref=f9e1811]:
          - text: 压缩数据用 ascii-zip，它构造 deflate 动态 Huffman 码表让输出字节全在
          - code [ref=f9e1812]: "[A-Za-z0-9]"
          - text: 。crc、压缩长度、原始长度、CD 偏移这些算出来的字段只能爆破，JSP 里填
          - code [ref=f9e1813]: <!-- AAAAA... -->
          - text: 当 padding，每轮重算 CRC 重新压缩，检查 4 个 4 字节字段。
        - list [ref=f9e1814]:
          - listitem [ref=f9e1815]: ascii-zip 输出比输入大（字母数字流开销约 1.5 倍），精简 JSP 压缩后 329 字节，CD 偏移 385 = 0x181 首字节超限，改 padding 没用因为偏移跟着压缩长度单调走，两步法先纯算 crc32 筛候选再压缩，padding 401 个 A 命中。
          - listitem [ref=f9e1816]: 手写 CD 条目时 external attrs 是 4 字节字段，按 2 字节写整个结构错位，Tomcat 报 invalid CEN header，context 起不来。
        - paragraph [ref=f9e1817]:
          - text: jar 条目用
          - code [ref=f9e1818]: META-INF/resources/shell.jsp
          - text: ，WebResourceRoot 映射成 webapp 根资源，reload 后直接访问。
        - paragraph [ref=f9e1819]:
          - text: 触发不用 EL，因为默认 WatchedResource 含
          - code [ref=f9e1820]: WEB-INF/tomcat-web.xml
          - text: ，autoDeploy 默认开，export 建个同名目录就触发 reload。合法 jar 不崩应用，这是比 EL 链强的地方。
