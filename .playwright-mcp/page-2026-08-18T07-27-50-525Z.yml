        - paragraph [ref=f9e1794]: Agent 测试发现的坑点：
        - list [ref=f9e1795]:
          - listitem [ref=f9e1796]: 重复访问会因 libattach.so 已加载报 500（URLClassLoader 重复加载 tools.jar），JSP 里加个静态标志跳过。
          - listitem [ref=f9e1797]:
            - text: 纯 transformer 型（直接改
            - code [ref=f9e1798]: ApplicationFilterChain.doFilter
            - text: 字节码）也试过，agentmain 注册 transformer + retransformClasses，注入器手写 class 文件解析（常量池追加 Methodref、插 9 字节模板、修异常表/局部变量表/StackMapTable），javap 验证帧表全对，但 JDK8 的 split verifier 对手工帧表极其挑剔，bad offset 反复出现，最终放弃。
          - listitem [ref=f9e1799]:
            - text: agentmain 线程的 TCCL 是 system classloader，defineClass 会挂
            - code [ref=f9e1800]: javax.servlet.Filter
            - text: 找不到，必须从 StandardContext 的 Loader 拿 WebappClassLoader（
            - code [ref=f9e1801]: ctx.getLoader().getClassLoader()
