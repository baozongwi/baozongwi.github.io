        - paragraph [ref=f9e1590]:
          - text: filename 无点整个变 UUID，有点只留最后一个点后面的后缀，dir 只能落在 webapp 内（getCanonicalPath 校验），子目录自动 mkdirs；content 先 trim 再按数组顺序替换，
          - code [ref=f9e1591]: "&"
          - text: 第一个被处理所以转成实体后不会被二次替换，落盘内容是
          - code [ref=f9e1592]: "\"DIRTY DATA AT THE BEGINNING \" + content + \" DIRTY DATA AT THE END\""
          - text: 。
        - paragraph [ref=f9e1593]:
          - code [ref=f9e1594]: "& < ' > \" ( )"
          - text: 全被吃，JSP 的
          - code [ref=f9e1595]: <%
          - code [ref=f9e1596]: "%>"
          - text: 引号括号没了。角度括号用 EL 绕（web.xml 4.0 默认解析 EL），但括号也被转义，
          - code [ref=f9e1597]: "${Runtime.getRuntime().exec(...)}"
          - text: 这种带参数的写法全废，只能属性读写，
          - code [ref=f9e1598]: .
          - text: 等价 getter，
          - code [ref=f9e1599]: =
          - text: 等价 setter。脏数据不影响 EL，模板文本原样拼接，
          - code [ref=f9e1600]: "${...}"
          - text: 前后夹什么都行。
        - paragraph [ref=f9e1601]: 翻译过来其实就是生活中很常见的文件上传场景，文件前缀不可控，目录不可穿越，落地文件有脏数据，有解析黑名单。
        - heading "EL 链" [level=3] [ref=f9e1602]
        - paragraph [ref=f9e1603]: 通过 SPEL 表达式和 Tomcat 本身机制我们可以轻松写入 jspshell
        - blockquote [ref=f9e1604]:
          - list [ref=f9e1605]:
            - listitem [ref=f9e1606]:
              - paragraph [ref=f9e1607]:
                - strong [ref=f9e1608]: Session 持久化（StandardManager）
                - text: ", 当 Tomcat 正常关闭，或者某个 Web 应用（Context）发生重载（Reload）时，为了防止用户的登录状态丢失，Tomcat 会把当前内存里所有活跃的 Session 对象，序列化成二进制数据，保存到磁盘上的一个文件里（默认叫"
                - code [ref=f9e1609]: SESSIONS.ser
                - text: ）。等到应用启动后，再从文件读取恢复。
            - listitem [ref=f9e1610]:
              - paragraph [ref=f9e1611]:
                - strong [ref=f9e1612]: JSP 引擎（Jasper）的容错性
                - text: ，JSP 引擎在编译
                - code [ref=f9e1613]: .jsp
                - text: 文件时，只认
                - code [ref=f9e1614]: <% %>
                - text: 里面的 Java 代码。至于
                - code [ref=f9e1615]: <%
                - text: 前面和
                - code [ref=f9e1616]: "%>"
                - text: 后面的任何东西（哪怕是乱码、乱七八糟的二进制字节），它统统当作普通的 HTML 文本（Template Text），直接原样输出到浏览器。
        - paragraph [ref=f9e1617]: 利用 param.x 这个姿势轻松绕过黑名单，参数外带，我们就可以尽可能的写入我们想写的东西。
        - generic [ref=f9e1618]:
          - code [ref=f9e1619]: "${pageContext.servletContext.classLoader.resources.context.manager.pathname=param.a} ${sessionScope[param.b]=param.c} ${pageContext.servletContext.classLoader.resources.context.reloadable=true} ${pageContext.servletContext.classLoader.resources.context.parent.appBase=param.d}"
          - button "Copy code" [ref=f9e1620] [cursor=pointer]
        - paragraph [ref=f9e1624]:
          - text: 第一行修改 StandardManager 的 session 持久化路径，第二行往 session 塞值，第三行开 reloadable，第四行把 appBase 改成
          - code [ref=f9e1625]: /
          - text: 。
        - paragraph [ref=f9e1626]:
          - text: 如何触发呢？reloadable=true 后往 WEB-INF/lib 写个文件，这里选择写个非法 jar，但非法 jar 会让 context 起不来，ROOT 直接 404，所以第四行要在触发前执行，appBase 改成
          - code [ref=f9e1627]: /
          - text: 后整个磁盘被当 webapps 扫，
          - code [ref=f9e1628]: /tmp
          - text: 自动部署成 webapp，session 写进
          - code [ref=f9e1629]: /tmp/session.jsp
          - text: 就能访问
