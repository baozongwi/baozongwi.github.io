            - text: 这个题是关于上个月 Magento RCE 漏洞 CVE-2025-54236 的复现，在我计划出这个题的时候，这个漏洞并没有引起什么重视（大概），也几乎没有分析。但实际上使用 Magento 的网站非常多，实际上的危害也比较严重。 在我开始独立分析这个漏洞的时候，能获取到的信息只有： Our security team successfully reproduced one possible avenue to exploit SessionReaper, but there are likely multiple vectors. While we cannot disclose technical details that could aid attackers, the vulnerability follows a familiar pattern from last year’s CosmicSting attack. The attack combines a malicious session with a nested deserialization bug in Magento’s REST API.The specific remote code execution vector appears to require file-based session storage. However, we recommend merchants using Redis or database sessions to take immediate action as well, as there are multiple ways to abuse this vulnerability. – sansec.io 和 CosmicSting 的分析报告
            - link "https://www.assetnote.io/resources/research/why-nested-deserialization-is-harmful-magento-xxe-cve-2024-34102⁠" [ref=f19e1278] [cursor=pointer]:
              - /url: https://www.assetnote.io/resources/research/why-nested-deserialization-is-harmful-magento-xxe-cve-2024-34102
            - text: 。 还有本次漏洞的补丁
            - link "https://github.com/magento/magento2/commit/8075ae19428870e3b6e4b8f9e0705389328d4515⁠" [ref=f19e1279] [cursor=pointer]:
              - /url: https://github.com/magento/magento2/commit/8075ae19428870e3b6e4b8f9e0705389328d4515
            - text: 。 综合上面的线索我们可以知道，这个RCE漏洞与 Session 相关，且漏洞形式与之前的 XXE 漏洞相同。 不过当我准备把他当作今年N1CTF的题目时，
            - link "slcyber.io⁠" [ref=f19e1280] [cursor=pointer]:
              - /url: https://slcyber.io/assetnote-security-research-center/why-nested-deserialization-is-still-harmful-magento-rce-cve-2025-54236/
            - text: 突然发布了关于这个漏洞的分析，就在比赛前的一周，这让我非常沮丧，甚至考虑放弃这道题目。但是这个漏洞本身的利用方法确实非常巧妙，我还是决定把它放出来。但是我不得不删除掉一些代码，以免我的题目被秒杀。=_= 非常有趣的是 CVE-2025-54236 的作者 Blaklis@The Flat Network Society，竟然做了这个用他的 CVE 出的题。 这些大概就是题目的内容，然后题目又是黑盒，当时我人工分析是没成功的，但是没想到过了半年 AI 在 20 分钟内解决了这道题 题面基本把方向给出来了：SessionReaper，malicious session，nested deserialization in Magento REST API。首页也很直接，
            - code [ref=f19e1281]: X-Magento-\*
            - text: 头、Luma 静态资源、
            - code [ref=f19e1282]: PHPSESSID
            - text: 都能看出来是 Magento。
          - generic [ref=f19e1283]:
            - code [ref=f19e1285]:
              - generic [ref=f19e1286]: GET /
              - generic [ref=f19e1289]: HTTP/1.1 200 OK
              - generic [ref=f19e1291]: "Set-Cookie: PHPSESSID=...; HttpOnly; SameSite=Lax"
              - generic [ref=f19e1293]: "X-Magento-Cache-Control: max-age=86400, public, s-maxage=86400"
              - generic [ref=f19e1295]: "X-Magento-Tags: cat_c,store,cms_b,cms_p_2,FPC"
            - button "Copy code" [ref=f19e1297] [cursor=pointer]
          - paragraph [ref=f19e1301]: 我一开始的思路是先解决两个问题：
          - list [ref=f19e1302]:
            - listitem [ref=f19e1303]:
              - text: 怎么把一个
              - code [ref=f19e1304]: sess\_<id>
              - text: 文件写到 Web 能碰到的位置；
            - listitem [ref=f19e1305]: 哪个 REST 参数能一路带到 session 初始化那里。
          - paragraph [ref=f19e1306]: 第二点才是这题有意思的地方。公开链里常见的入口被题目处理过，直接照抄基本走不通。 Magento 前台有个地址文件上传接口：
          - generic [ref=f19e1307]:
            - code [ref=f19e1309]:
              - generic [ref=f19e1310]: curl -i -X POST http://127.0.0.1:8080/customer/address_file/upload
            - button "Copy code" [ref=f19e1312] [cursor=pointer]
          - paragraph [ref=f19e1316]:
            - text: 直接 POST 会跳回首页，cookie 里还能看到
            - code [ref=f19e1317]: Invalid Form Key
            - text: ：
          - generic [ref=f19e1318]:
            - code [ref=f19e1320]:
              - generic [ref=f19e1321]: HTTP/1.1 302 Found
              - generic [ref=f19e1323]: "Set-Cookie: mage-messages=...Invalid%20Form%20Key..."
              - generic [ref=f19e1325]: "Location: http://127.0.0.1/"
            - button "Copy code" [ref=f19e1327] [cursor=pointer]
          - paragraph [ref=f19e1331]: 加上 XHR 头就不一样了：
          - generic [ref=f19e1332]:
            - code [ref=f19e1334]:
              - generic [ref=f19e1335]: curl -i -X POST \
              - generic [ref=f19e1337]: "-H 'X-Requested-With: XMLHttpRequest' \\"
              - generic [ref=f19e1339]: http://127.0.0.1:8080/customer/address_file/upload
            - button "Copy code" [ref=f19e1341] [cursor=pointer]
          - paragraph [ref=f19e1345]: 返回的是正常 JSON：
          - generic [ref=f19e1346]:
            - code [ref=f19e1348]:
              - generic [ref=f19e1349]: "{\"error\":\"No files for upload.\",\"errorcode\":0}"
            - button "Copy code" [ref=f19e1351] [cursor=pointer]
          - paragraph [ref=f19e1355]:
            - text: 于是试一下
