      - paragraph [ref=f8e78]
      - paragraph [ref=f8e82]: 13号我又闲不住了，其实我回学校这么久了，经常出去玩，宿舍应该都没睡够7天，想着没去过都江堰，那就去都江堰玩下吧
      - paragraph [ref=f8e83]: 又是经典节目，卡点在车站里面奔跑，最后a8检票口，我还以为是b8，差点上不到车
      - paragraph [ref=f8e84]
      - paragraph [ref=f8e86]
      - paragraph [ref=f8e88]: 这里距离上车应该是还有正好 15 分钟
      - paragraph [ref=f8e89]: 中午吃的 太平张醪糟，自己点了一碗杂酱面一碗醪糟
      - paragraph [ref=f8e90]
      - paragraph [ref=f8e92]
      - paragraph [ref=f8e94]: 然后就打车去秦堰楼入口
      - paragraph [ref=f8e95]
      - paragraph [ref=f8e97]
      - paragraph [ref=f8e99]
      - paragraph [ref=f8e101]
      - paragraph [ref=f8e103]
      - paragraph [ref=f8e105]: 逛下来只有三个小时就逛完了，很轻松😉
      - paragraph [ref=f8e106]: 接着我看到花花很甜，想起来董梦博就在这边就约他晚上来吃顿饭，吃的 灶上鲜·肝腰合炒(都江堰店) 挺好吃，正常川菜味道吧，感觉不是那么惊艳，但是价格很美丽
      - paragraph [ref=f8e107]: 去了南桥，看了蓝眼泪，我已经看着像是绿眼泪🥲，忘记拍照了
      - paragraph [ref=f8e108]: 董梦博走了之后和一个同学打王者，这个同学是最近认识的，辅助很厉害，我射手很激进也能保护好我
      - paragraph [ref=f8e109]: 放一下和她一起玩的时候的战绩图
      - paragraph [ref=f8e110]
      - paragraph [ref=f8e112]
      - paragraph [ref=f8e114]: 第二天的计划是去熊猫谷，再回来退房再去车站，但是10点起床我以为熊猫谷会有点大，于是直接退房了，这次住的是海友6.0也是第一次住，感觉除了有点小，其他和全季几乎一模一样，很实惠，适合大学生穷游
