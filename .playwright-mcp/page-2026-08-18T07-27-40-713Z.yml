      - paragraph [ref=f8e57]: 和汤昌松去了大熊猫基地
      - paragraph [ref=f8e58]: 这是花花
      - paragraph [ref=f8e59]
      - paragraph [ref=f8e61]
      - paragraph [ref=f8e63]: 中午吃的酒店附近，随便一家火锅，大众给好评，还有瓶装可乐喝，这种可乐最好喝了。
      - paragraph [ref=f8e64]: 酒店住的全季晓山青，第一次住这种酒店体验挺好的
      - paragraph [ref=f8e65]
      - paragraph [ref=f8e67]
      - paragraph [ref=f8e69]
      - paragraph [ref=f8e71]: 吃完饭之后我看到了这家店的老板，发现他腿脚并不是很方便，也在努力生活而且生活的还不错٩(๑^o^๑)۶
      - paragraph [ref=f8e72]: 后面晚上去了浣花溪公园，喝茶吃瓜子🍉(＾▽＾)，看到了粉红色脚的🐦，没拍照
      - paragraph [ref=f8e73]: 然后我就回学校赶课设了，最后还是写了两个自己满意的应用
      - paragraph [ref=f8e74]: langchain：
      - paragraph [ref=f8e75]
