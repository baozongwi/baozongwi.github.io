          - paragraph [ref=f1e578]:
            - text: 很显然是可以打 php-filter-chain，但是
            - code [ref=f1e579]: viewFile
            - text: 不是 include，需要 Ignition 先读出来，过一遍 token 检查，再写回同一个文件。
          - paragraph [ref=f1e580]:
            - text: 生成方式和陆队博客写的 php filter chain 一样，先用
            - code [ref=f1e581]: UTF-8 -> ISO-2022-KR
            - text: 在内容前面塞进
            - code [ref=f1e582]: \x1b$)C
            - text: ，base64 之后只剩下一个字符
            - code [ref=f1e583]: C
            - text: ，再用每一组 iconv 往 base64 前面补一个字符，补完之后做一次 base64-decode，得到的就是我们要的 PHP，后面跟着原来文件的脏数据。这题的 PHP 是 glibc，这组过滤器能创建。有两个点要自己处理：
          - list [ref=f1e584]:
            - listitem [ref=f1e585]:
              - text: 过滤器写成
              - code [ref=f1e586]: read=
              - text: 。不写的话，
              - code [ref=f1e587]: file_put_contents
              - text: 写回去时同一套链会再跑一遍，内容被写坏。
            - listitem [ref=f1e588]:
              - text: payload 末尾加
              - code [ref=f1e589]: __halt_compiler()
              - text: 。脏数据还在，但 PHP 不再解析它。
