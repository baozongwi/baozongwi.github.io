{{ define "main" }}
<div class="container notfound">
  <p class="notfound__code" aria-hidden="true">404</p>
  <h1 class="notfound__title">This page wandered off</h1>
  <p class="notfound__text">链接指向的页面不在了，可能是文章换了地址，或者从来就没有过。</p>
  <div class="notfound__actions">
    <a class="notfound__btn" href="{{ "/" | relLangURL }}">回到首页</a>
    <a class="notfound__btn" href="{{ "archives/" | relLangURL }}">看看归档</a>
    <button class="notfound__btn notfound__btn--ghost" type="button" data-search-open>搜一下</button>
  </div>
</div>
<script>
  document.querySelector('[data-search-open]').addEventListener('click', function() {
    var btn = document.getElementById('search-btn');
    if (btn) btn.click();
  });
</script>
{{ end }}
