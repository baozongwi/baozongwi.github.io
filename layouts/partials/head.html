<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
{{ with .Site.Params.favicon }}<link rel="icon" href="{{ . | relURL }}">{{ end }}
<script>
(function(){
  // 清理旧版 localStorage 残留，避免老用户被旧数据卡住
  localStorage.removeItem('flavor-theme');
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var ov = sessionStorage.getItem('flavor-theme-override');
  // 本次会话用户手动切换过 → 以手动选择为准
  if (ov === 'light' || ov === 'dark') {
    document.documentElement.setAttribute('data-theme', ov);
    return;
  }
  // 未手动切换过 → 跟随系统
  document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light');
})();
</script>
{{- /* 思源黑体：本地 unicode-range 分片。一份清单 CSS 异步加载，latin-400 预取，其余按字符按需拉取。 */ -}}
<link rel="preload" as="font" type="font/woff2" href="{{ "fonts/noto-sans-sc/files/noto-sans-sc-latin-400-normal.woff2" | relURL }}" crossorigin>
<link rel="preload" as="style" href="{{ "fonts/noto-sans-sc/all.css" | relURL }}" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
<link rel="stylesheet" href="{{ "fonts/noto-sans-sc/all.css" | relURL }}">
</noscript>
{{- $style := resources.Get "scss/main.scss" | toCSS | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $style.RelPermalink }}">
{{- partial "meta.html" . -}}
{{- partial "schema.html" . -}}
