{{ define "main" }}
{{- $endpoint := "https://circle.baozongwi.xyz/circle.json" -}}
{{- with .Site.Params.circle.endpoint }}{{ $endpoint = . }}{{ end -}}
<div class="container circle-page" data-circle-endpoint="{{ $endpoint }}">
  <h1 class="circle-page__title">{{ .Title }}</h1>

  {{ if .Content }}
  <div class="article-content circle-page__intro">{{ .Content }}</div>
  {{ end }}

  <div class="circle-meta">
    <span data-circle-meta-updated hidden>更新于 <time datetime="" data-circle-updated></time></span>
    <span data-circle-count></span>
  </div>

  <section class="circle-fish" id="circle-fish" hidden>
    <div class="circle-fish__bar">
      <span class="circle-fish__label">随缘看看</span>
      <button type="button" class="circle-fish__swap" id="circle-fish-swap">换一篇</button>
    </div>
    <div id="circle-fish-slot"></div>
  </section>

  <div class="circle-feed" id="circle-feed" data-pagefind-ignore>
    <p class="circle-empty">正在读取。</p>
  </div>
  <noscript><p class="circle-empty">需要 JavaScript 才能读取友链圈。</p></noscript>

  <nav class="pagination circle-pager" id="circle-pager" hidden aria-label="分页">
    <button type="button" class="pagination__prev" id="circle-prev">← Prev</button>
    <span class="pagination__info" id="circle-page-info">1 / 1</span>
    <button type="button" class="pagination__next" id="circle-next">Next →</button>
  </nav>
</div>
{{ end }}
