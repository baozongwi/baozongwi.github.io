{{ define "main" }}
<div class="container guestbook-page">
  <h1 class="guestbook-page__title" id="guestbook-title">{{ .Title }}</h1>
  {{ if .Content }}
  <div class="guestbook-page__intro">{{ .Content }}</div>
  {{ end }}

  <form id="guestbook-form" class="guestbook-form" action="#" method="post">
    <div class="guestbook-form__row">
      <input type="text" name="name" maxlength="24" placeholder="昵称" required autocomplete="nickname" aria-label="昵称">
      <input type="email" name="email" maxlength="80" placeholder="邮箱（可选，悄悄话想收到回复必填）" autocomplete="email" aria-label="邮箱">
    </div>
    <input type="text" name="company" class="guestbook-form__hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <textarea name="text" maxlength="500" rows="5" placeholder="想说就说…" required aria-label="内容"></textarea>
    <label class="guestbook-form__whisper">
      <input type="checkbox" name="whisper">
      悄悄话
    </label>
    <div class="guestbook-form__actions">
      <button type="submit" class="guestbook-form__submit">发送</button>
      <span id="guestbook-status" class="guestbook-form__status" role="status"></span>
    </div>
  </form>

  <p id="guestbook-count" class="guestbook-page__count" hidden></p>
  <ul id="guestbook-list" class="guestbook-list">
    <li class="guestbook-list__empty">还没有人说话，来写第一条吧</li>
  </ul>
</div>
{{ end }}
