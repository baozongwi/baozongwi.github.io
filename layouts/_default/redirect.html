<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>
  <link rel="canonical" href="{{ .Params.redirect }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url={{ .Params.redirect }}">
  <script>location.replace({{ .Params.redirect }});</script>
</head>
<body>
  <p>本文已迁至 <a href="{{ .Params.redirect }}">{{ .Title }}</a>。</p>
</body>
</html>
