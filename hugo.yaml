baseurl: https://baozongwi.xyz/
locale: zh-cn
theme: "flavor"
title: baozongwi's blog
copyright: baozongwi

DefaultContentLanguage: en
hasCJKLanguage: false

services:
    rss:
        limit: 10

pagination:
    pagerSize: 10

outputs:
    home:
        - html
        - rss
    page:
        - html
    section:
        - html
        - rss
    taxonomy:
        - html
    term:
        - html

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    description: "Currently exploring Java security and internal network penetration, with CTFs as a hobby."
    # 首页说说，想换心情就改这一行
    status: "忙碌的生活中🫠"
    keywords:
        - Java Security
        - CTF
        - Code Audit
        - Penetration Testing
    author:
        name: baozongwi
        email: baozongwi@qq.com
        url: /about/
    avatar: img/acvtar.jpg
    favicon: logo.png
    defaultSocialImage: logo.png
    ogLocale: zh_CN
    license: "Licensed under CC BY-NC-SA 4.0"

    welcome:
        enabled: true
        text: "越想越难耐🤬"

    font:
        css: fonts/tsanger-jinkai02/result.css
        preload: fonts/tsanger-jinkai02/20307ec77575b65807a8b0c5b7201f43.woff2

    footer:
        since: 2024

    typewriter:
        slogans:
            - "天地不仁，以万物为刍狗"
            - "flag{code_audit_ad_attack_cloud_sec}"

menu:
    main:
        - identifier: travel
          name: Travel
          url: /travel/
          weight: 5
          params:
              icon: travel

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/baozongwi
          weight: 1
          params:
              icon: github

        - identifier: email
          name: Email
          url: mailto:baozongwi@qq.com
          weight: 2
          params:
              icon: mail

        - identifier: discord
          name: Discord
          url: "https://discord.com/users/1276595362970337414"
          weight: 3
          params:
              icon: discord

        - identifier: rss
          name: RSS
          url: /index.xml
          weight: 5
          params:
              icon: rss

markup:
    goldmark:
        extensions:
            linkify: true
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                        - ["{{%", "%}}"]
                    inline:
                        - - \(
                          - \)
                        - ["{{%", "%}}"]
        renderer:
            hardWraps: true
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: false
        lineNoStart: 1
        lineNos: false
        lineNumbersInTable: false
        tabWidth: 4

timeout: "60m"

imaging:
    quality: 80
    resampleFilter: CatmullRom
    hint: picture
    anchor: Center
    exif:
        disableLatLong: true

module:
    mounts:
        - source: content
          target: content
          files:
              - "! **.png"
              - "! **.jpg"
              - "! **.jpeg"
              - "! **.webp"
              - "**"
        - source: content
          target: assets/c
        - source: assets
          target: assets
        - source: static
          target: static
          files:
              - "! friends/avatars/**"
              - "**"
        - source: static
          target: assets/s
        - source: layouts
          target: layouts
        - source: data
          target: data
        - source: archetypes
          target: archetypes
