name: Update circle

on:
  schedule:
    - cron: "23 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: circle-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.1"
          extended: true

      - uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-images-${{ hashFiles('hugo.toml', 'themes/flavor/layouts/partials/process-image.html') }}
          restore-keys: |
            hugo-images-

      - uses: actions/configure-pages@v6

      - name: Fetch friend-circle RSS
        id: circle
        run: node scripts/fetch-circle.mjs
        continue-on-error: true

      - name: Commit circle data
        if: steps.circle.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/circle.json data/circle_avatars.json static/circle/avatars
          if git diff --staged --quiet; then
            echo "circle data unchanged"
            exit 0
          fi
          git commit -m "Update circle feeds"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main || { echo "fetch failed; this run still deploys the fetched circle"; exit 0; }
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "rebase failed"
              break
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "push failed, retry ${attempt}"
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "could not push circle data; this run still deploys the fetched circle"
          fi

      - run: hugo --minify --buildFuture --cleanDestinationDir --gc

      - name: Cache Pagefind
        id: pagefind
        uses: actions/cache@v6
        with:
          path: ~/pagefind-bin
          key: pagefind-1.5.0-x86_64-unknown-linux-musl

      - name: Install Pagefind
        if: steps.pagefind.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/pagefind-bin"
          curl -fsSL -o /tmp/pagefind.tar.gz \
            https://github.com/CloudCannon/pagefind/releases/download/v1.5.0/pagefind-v1.5.0-x86_64-unknown-linux-musl.tar.gz
          echo "0a10c6d780bc2a61378cfafe01be620a4de8400de4a1eafd180a0015d002000b  /tmp/pagefind.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pagefind.tar.gz -C "$HOME/pagefind-bin"
          chmod +x "$HOME/pagefind-bin/pagefind"

      - name: Build Pagefind search index
        run: |
          "$HOME/pagefind-bin/pagefind" --site public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
