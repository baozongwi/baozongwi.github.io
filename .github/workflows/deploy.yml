name: Deploy Hugo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.1"
          extended: true

      # Only the processed images are worth caching (they take minutes to
      # regenerate). The rest of resources/_gen — compiled SCSS/JS — is keyed
      # on the entry file alone, so a change inside an @import'ed partial did
      # not invalidate it and CI could ship stale CSS from the cache.
      #
      # v2: the path changed from resources/_gen to resources/_gen/images. The
      # unrestored v1 archive packed the old layout, so a cache hit put the
      # images somewhere Hugo cannot see them and every run reprocessed all
      # 3175 images (~4.5 min locally). The version prefix forces one fresh
      # save at the new path.
      - uses: actions/cache@v6
        with:
          path: resources/_gen/images
          key: hugo-images-v2-${{ hashFiles('hugo.toml', 'themes/flavor/layouts/partials/process-image.html') }}
          restore-keys: |
            hugo-images-v2-

      - uses: actions/configure-pages@v6

      - run: hugo --minify --buildFuture --cleanDestinationDir --gc

      - name: Cache Pagefind
        id: pagefind
        uses: actions/cache@v6
        with:
          path: ~/pagefind-bin
          key: pagefind-1.5.0-x86_64-unknown-linux-musl

      - name: Install Pagefind
        if: steps.pagefind.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/pagefind-bin"
          curl -fsSL -o /tmp/pagefind.tar.gz \
            https://github.com/CloudCannon/pagefind/releases/download/v1.5.0/pagefind-v1.5.0-x86_64-unknown-linux-musl.tar.gz
          echo "0a10c6d780bc2a61378cfafe01be620a4de8400de4a1eafd180a0015d002000b  /tmp/pagefind.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pagefind.tar.gz -C "$HOME/pagefind-bin"
          chmod +x "$HOME/pagefind-bin/pagefind"

      - name: Build Pagefind search index
        run: |
          "$HOME/pagefind-bin/pagefind" --site public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
