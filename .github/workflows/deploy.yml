name: Deploy Hugo Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.1"
          extended: true

      - uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-images-${{ hashFiles('hugo.toml', 'layouts/**', 'themes/flavor/layouts/**') }}
          restore-keys: |
            hugo-images-

      - uses: actions/configure-pages@v6

      - run: hugo --minify --buildFuture --cleanDestinationDir --gc

      - name: Build Pagefind search index
        run: npx -y pagefind@1.5.0 --site public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
