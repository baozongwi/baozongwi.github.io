baseURL = "https://baozongwi.xyz/"
locale = "zh-cn"
theme = "flavor"
title = "baozongwi's blog"
copyright = "baozongwi"

defaultContentLanguage = "en"
hasCJKLanguage = false
timeout = "60m"

[services.rss]
  limit = 10

[pagination]
  pagerSize = 10

[outputs]
  home = ["html", "rss"]
  page = ["html"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html"]

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[params]
  mainSections = ["post"]
  description = "Currently exploring Java security and internal network penetration, with CTFs as a hobby."
  # 首页说说，想换心情就改这一行
  status = "闭关..."
  keywords = ["Java Security", "CTF", "Code Audit", "Penetration Testing"]
  avatar = "img/acvtar.jpg"
  favicon = "logo.png"
  defaultSocialImage = "logo.png"
  ogLocale = "zh_CN"
  license = "Licensed under CC BY-NC-SA 4.0"

  [params.author]
    name = "baozongwi"
    email = "baozongwi@qq.com"
    url = "/about/"

  [params.welcome]
    enabled = true
    text = "越想越难耐🤬"

  [params.font]
    css = "fonts/tsanger-jinkai02/result.css"
    preload = "fonts/tsanger-jinkai02/20307ec77575b65807a8b0c5b7201f43.woff2"

  [params.footer]
    since = 2024
    sponsor_name = "林枫云"
    sponsor_url = "https://www.dkdun.cn/"

  # 页脚计数。数字在自己的服务器上，占位和线上一致。
  [params.stats]
    pv = 207841
    uv = 46153
    endpoint = "https://su-team.cn/count"

  [params.typewriter]
    slogans = [
      "天地不仁，以万物为刍狗",
      "flag{code_audit_ad_attack_cloud_sec}",
    ]

[menu]
  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/baozongwi"
    weight = 1
    [menu.social.params]
      icon = "github"

  [[menu.social]]
    identifier = "email"
    name = "Email"
    url = "mailto:baozongwi@qq.com"
    weight = 2
    [menu.social.params]
      icon = "mail"

  [[menu.social]]
    identifier = "travel"
    name = "Travel"
    url = "/travel/"
    weight = 4
    [menu.social.params]
      icon = "travel"

  [[menu.social]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    weight = 5
    [menu.social.params]
      icon = "rss"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      linkify = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$'], ['{{%', '%}}']]
        inline = [['\(', '\)'], ['{{%', '%}}']]
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    tabWidth = 4

[imaging]
  quality = 80
  resampleFilter = "CatmullRom"
  hint = "picture"
  anchor = "Center"
  [imaging.exif]
    disableLatLong = true

[[module.mounts]]
  source = "content"
  target = "content"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "**"]

[[module.mounts]]
  source = "content"
  target = "assets/c"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "static"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "! **.gif", "! **.ico", "**"]

# 友链热链用的头像，路径保持不变
[[module.mounts]]
  source = "static/img/acvtar.jpg"
  target = "static/img/acvtar.jpg"

[[module.mounts]]
  source = "static/images/acvtar.jpg"
  target = "static/images/acvtar.jpg"

[[module.mounts]]
  source = "static/img/acvtar_hu_7341a42b1508c763.jpg"
  target = "static/img/acvtar_hu_7341a42b1508c763.jpg"

[[module.mounts]]
  source = "static/img/acvtar_hu_773da4d2b586f7f.jpg"
  target = "static/img/acvtar_hu_773da4d2b586f7f.jpg"

[[module.mounts]]
  source = "static"
  target = "assets/s"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "archetypes"
  target = "archetypes"
