baseURL = "https://baozongwi.xyz/"
locale = "zh-cn"
theme = "flavor"
title = "baozongwi's blog"
copyright = "baozongwi"

defaultContentLanguage = "en"
hasCJKLanguage = false
timeout = "60m"

[services.rss]
  limit = 10

[pagination]
  pagerSize = 10

[outputs]
  home = ["html", "rss"]
  page = ["html"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html"]

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[params]
  mainSections = ["post"]
  description = "Currently exploring Java security and internal network penetration, with CTFs as a hobby."
  # 首页说说，想换心情就改这一行
  status = "遭不住了，😪"
  keywords = ["Java Security", "CTF", "Code Audit", "Penetration Testing"]
  avatar = "img/acvtar.jpg"
  favicon = "logo.png"
  defaultSocialImage = "logo.png"
  ogLocale = "zh_CN"
  license = "Licensed under CC BY-NC-SA 4.0"

  [params.author]
    name = "baozongwi"
    email = "baozongwi@qq.com"
    url = "/about/"

  [params.welcome]
    enabled = true
    text = "越想越难耐🤬"

  [params.font]
    css = "https://su-team.cn/fonts/result.css"

  [params.footer]
    since = 2024
    sponsor_name = "林枫云"
    sponsor_url = "https://www.dkdun.cn/"

  # 正文末尾赞赏码，和文章同一容器；加密文未解锁时不出现。单篇 reward: false 可关掉。
  # 暗色主题用同目录 wechat-dark.webp；也可显式写 wechat_dark。
  [params.reward]
    enable = true
    wechat = "img/wechat.webp"

  # 页脚计数。数字在自己的服务器上，占位和线上一致。
  [params.stats]
    pv = 207841
    uv = 46153
    endpoint = "https://su-team.cn/count"

  # 留言页，接口和计数共用 su-team.cn/count（flavor-stats /guestbook）
  [params.guestbook]
    endpoint = "https://su-team.cn/count"

  [params.typewriter]
    slogans = [
      "天地不仁，以万物为刍狗",
      "flag{code_audit_ad_attack_cloud_sec}",
    ]

[menu]
  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/baozongwi"
    weight = 1
    [menu.social.params]
      icon = "github"

  [[menu.social]]
    identifier = "travel"
    name = "Travel"
    url = "/travel/"
    weight = 4
    [menu.social.params]
      icon = "travel"

  [[menu.social]]
    identifier = "guestbook"
    name = "净土"
    url = "/guestbook/"
    weight = 5
    [menu.social.params]
      icon = "guestbook"

  [[menu.social]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    weight = 6
    [menu.social.params]
      icon = "rss"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      linkify = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$'], ['{{%', '%}}']]
        inline = [['\(', '\)'], ['{{%', '%}}']]
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    tabWidth = 4

[imaging]
  quality = 80
  resampleFilter = "CatmullRom"
  hint = "picture"
  anchor = "Center"
  [imaging.exif]
    disableLatLong = true

[[module.mounts]]
  source = "content"
  target = "content"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "**"]

[[module.mounts]]
  source = "content"
  target = "assets/c"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "static"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "! **.gif", "! **.ico", "**"]

# 友链热链旧地址，必须原图直出：https://baozongwi.xyz/images/acvtar.jpg
[[module.mounts]]
  source = "static"
  target = "static"
  files = ["images/acvtar.jpg", "img/acvtar.jpg"]

# 头像、赞赏码源文件走 assets/s，由模板 RelPermalink / process-image 发布，
# 不再把 jpg/png 原图和旧 hugo 哈希副本挂到 static。
[[module.mounts]]
  source = "static"
  target = "assets/s"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "archetypes"
  target = "archetypes"
