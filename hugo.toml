baseURL = "https://baozongwi.xyz/"
locale = "zh-cn"
theme = "flavor"
title = "baozongwi's blog"
copyright = "baozongwi"

defaultContentLanguage = "en"
hasCJKLanguage = false
timeout = "60m"

[services.rss]
  limit = 10

[pagination]
  pagerSize = 10

[outputs]
  home = ["html", "rss"]
  page = ["html"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html"]

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[params]
  mainSections = ["post"]
  description = "Currently exploring Java security and internal network penetration, with CTFs as a hobby."
  # 首页说说，想换心情就改这一行
  status = "这世界总有人在忙忙碌碌寻🪎，却误了浮世骄阳 也错过人间万象"
  keywords = ["Java Security", "CTF", "Code Audit", "Penetration Testing"]
  avatar = "img/acvtar.jpg"
  favicon = "logo.png"
  defaultSocialImage = "logo.png"
  ogLocale = "zh_CN"
  license = "Licensed under CC BY-NC-SA 4.0"

  [params.author]
    name = "baozongwi"
    email = "baozongwi@qq.com"
    url = "/about/"

  [params.welcome]
    enabled = true
    text = "越想越难耐🤬"

  [params.font]
    css = "fonts/tsanger-jinkai02/result.css"
    preload = "fonts/tsanger-jinkai02/20307ec77575b65807a8b0c5b7201f43.woff2"

  [params.footer]
    since = 2024

  [params.typewriter]
    slogans = [
      "天地不仁，以万物为刍狗",
      "flag{code_audit_ad_attack_cloud_sec}",
    ]

[menu]
  [[menu.main]]
    identifier = "travel"
    name = "Travel"
    url = "/travel/"
    weight = 5
    [menu.main.params]
      icon = "travel"

  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/baozongwi"
    weight = 1
    [menu.social.params]
      icon = "github"

  [[menu.social]]
    identifier = "email"
    name = "Email"
    url = "mailto:baozongwi@qq.com"
    weight = 2
    [menu.social.params]
      icon = "mail"

  [[menu.social]]
    identifier = "discord"
    name = "Discord"
    url = "https://discord.com/users/1276595362970337414"
    weight = 3
    [menu.social.params]
      icon = "discord"

  [[menu.social]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    weight = 5
    [menu.social.params]
      icon = "rss"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      linkify = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$'], ['{{%', '%}}']]
        inline = [['\(', '\)'], ['{{%', '%}}']]
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    tabWidth = 4

[imaging]
  quality = 80
  resampleFilter = "CatmullRom"
  hint = "picture"
  anchor = "Center"
  [imaging.exif]
    disableLatLong = true

[[module.mounts]]
  source = "content"
  target = "content"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "**"]

[[module.mounts]]
  source = "content"
  target = "assets/c"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "static"
  files = ["! friends/avatars/**", "**"]

[[module.mounts]]
  source = "static"
  target = "assets/s"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "archetypes"
  target = "archetypes"
