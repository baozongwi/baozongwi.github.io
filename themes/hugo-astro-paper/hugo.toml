# Theme-level default configuration.
# These values are deep-merged into the site's hugo.toml (Hugo >= 0.112).
# Everything here can be overridden by the site configuration.

# Reference defaults for the markup settings this theme expects.
# NOTE: Hugo does not merge `markup` from theme config by default. These values
# are also written in exampleSite/hugo.toml — sites using this theme should
# copy that block into their own configuration.
[markup]
  # parse fence info-string attributes (file="...") for the code render hook
  [markup.goldmark.parser.attribute]
    block = true
    title = true
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  # Allow raw HTML in markdown (AstroPaper posts use <figure> etc.)
  [markup.goldmark.renderer]
    unsafe = true

# AstroPaper only uses "tags".
[taxonomies]
  tag = "tags"

# AstroPaper exposes a site-wide feed at /rss.xml (not /index.xml).
# Overriding the built-in RSS output format's baseName achieves this.
[outputFormats]
  [outputFormats.RSS]
    baseName = "rss"

[params]
  # Default social links shown in the hero and footer.
  # Each item: { name, url, linkTitle? } — name must match an icon in
  # assets/icons/socials/<name>.svg (github, x, linkedin, mail, telegram,
  # whatsapp, facebook, pinterest, ...)
  socials = []

  # Feature switches — mirror of astro-paper.config.ts `features`
  [params.features]
    lightAndDarkMode = true
    showBackButton = true
    showArchives = true
    toc = true
    search = "pagefind"
