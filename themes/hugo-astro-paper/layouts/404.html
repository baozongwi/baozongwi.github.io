{{ define "main" }}
  <main
    id="main-content"
    class="app-layout error-main"
  >
    <div class="error-box">
      <h1 class="error-code">404</h1>
      <span aria-hidden="true"> ¯\_(ツ)_/¯ </span>
      <p class="error-message">{{ T "notfound_message" }}</p>
      <a href="{{ site.Home.RelPermalink }}" class="btn-link error-home">
        {{ T "notfound_go_home" }}
      </a>
    </div>
  </main>
{{ end }}
