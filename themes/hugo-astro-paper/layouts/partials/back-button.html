{{- if default true site.Params.features.showBackButton -}}
  <div class="back-button app-layout post-layout">
    <a id="back-button" href="{{ site.Home.RelPermalink }}" class="btn-link focus-outline">
      {{ partial "icon.html" "IconChevronLeft" }}
      <span>{{ T "post_go_back" }}</span>
    </a>
  </div>
{{- end -}}
