{{- /* Post floating back-to-top button with a scroll-progress ring.
       (The table of contents lives inline under the post title, flavor
       style — so the FAB is always just back-to-top.) */ -}}
<div id="post-fab" class="post-fab" data-pagefind-ignore>
  <button
    type="button"
    class="post-fab-btn"
    aria-label="{{ T "post_back_to_top" }}"
  >
    <span class="post-fab-progress" aria-hidden="true"></span>
    <span class="post-fab-icon-top">{{ partial "icon.html" "IconArrowNarrowUp" }}</span>
  </button>
</div>
