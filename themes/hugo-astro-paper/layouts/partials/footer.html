{{- $noMarginTop := .Scratch.Get "footer_no_mt" | default false -}}
<footer class="app-footer app-layout{{ if not $noMarginTop }} footer-mt-auto{{ end }}">
  <div class="app-footer-inner">
    {{ partial "socials.html" . }}
    <div class="footer-copyright">
      <span>{{ T "footer_copyright" }} &#169; {{ now.Format "2006" }}</span>
      <span class="footer-sep" aria-hidden="true">&nbsp;|&nbsp;</span>
      <span>{{ T "footer_all_rights_reserved" }}</span>
    </div>
  </div>
</footer>
