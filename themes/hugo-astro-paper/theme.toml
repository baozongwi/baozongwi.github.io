name = "AstroPaper for Hugo"
license = "MIT"
licenselink = "https://github.com/baozongwi/hugo-astro-paper/blob/main/LICENSE"
description = "A faithful Hugo port of AstroPaper: a minimal, responsive, accessible and SEO-friendly blog theme."
homepage = "https://github.com/baozongwi/hugo-astro-paper"
demosite = "https://astro-paper.pages.dev/"
tags = ["blog", "minimal", "dark mode", "responsive", "accessibility", "search", "toc", "archives"]
features = [
  "dark mode",
  "responsive",
  "search",
  "table of contents",
  "archives",
  "tags",
  "rss",
  "seo",
  "accessibility",
]
min_version = "0.158.0"

[original_theme]
  name = "AstroPaper"
  homepage = "https://github.com/satnaing/astro-paper"
  repo = "https://github.com/satnaing/astro-paper"

[author]
  name = "baozongwi"
  homepage = "https://github.com/baozongwi"
