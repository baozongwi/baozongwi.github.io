{{ define "main" }}
{{- $terms := .Data.Terms.Alphabetical -}}
{{- $kind := "标签" -}}
{{- if eq .Data.Plural "categories" -}}{{- $kind = "分类" -}}{{- end -}}
<div class="container term-cloud-page">
  <h1 class="term-cloud-page__title">{{ .Title }}</h1>
  <p class="term-cloud-page__total">共 {{ len $terms }} 个{{ $kind }}</p>
  <div class="term-cloud">
    {{- range $terms -}}
      <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
    {{- end -}}
  </div>
</div>
{{ end }}
