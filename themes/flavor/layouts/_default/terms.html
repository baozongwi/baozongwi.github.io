{{ define "main" }}
{{- $terms := .Data.Terms.Alphabetical -}}
{{- $kind := "tags" -}}
{{- if eq .Data.Plural "categories" -}}{{- $kind = "categories" -}}{{- end -}}
<div class="container term-cloud-page">
  <h1 class="term-cloud-page__title">{{ .Title }}</h1>
  <p class="term-cloud-page__total">{{ len $terms }} {{ $kind }}</p>
  <ul class="term-cloud">
    {{- range $terms -}}
    <li>
      <a href="{{ .Page.RelPermalink }}">
        <svg class="term-cloud__hash" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14M11 4 7 20M17 4 13 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>{{ .Page.LinkTitle }}</span>
      </a>
    </li>
    {{- end -}}
  </ul>
</div>
{{ end }}
