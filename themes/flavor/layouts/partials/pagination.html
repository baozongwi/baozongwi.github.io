{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ if $paginator.HasPrev }}
  <a href="{{ $paginator.Prev.URL }}" class="pagination__prev" rel="prev">← Prev</a>
  {{ else }}
  <span class="pagination__prev disabled">← Prev</span>
  {{ end }}

  <span class="pagination__info">{{ $paginator.PageNumber }} / {{ $paginator.TotalPages }}</span>

  {{ if $paginator.HasNext }}
  <a href="{{ $paginator.Next.URL }}" class="pagination__next" rel="next">Next →</a>
  {{ else }}
  <span class="pagination__next disabled">Next →</span>
  {{ end }}
</nav>
{{ end }}
