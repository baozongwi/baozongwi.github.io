<div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search" data-pagefind="{{ "pagefind/pagefind.js" | relURL }}">
  <div class="search-overlay__dialog">
    <div class="search-overlay__input-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <label class="sr-only" for="search-input">Search titles, tags, categories or text</label>
      <input type="text" id="search-input" placeholder="Search titles, tags, categories or text..." autocomplete="off">
    </div>
    <div class="search-overlay__results" id="search-results" aria-live="polite">
      <div class="search-overlay__empty">Type to start searching</div>
    </div>
  </div>
</div>
